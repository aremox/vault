server:
  port: 8080

spring:
  application:
    name: vault-rotation-pilot
  config:
    import: "optional:configserver:http://172.29.0.60:8888"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,env

pilot:
  secrets:
    dynamic-file: /run/secrets/db-dynamic.properties
    static-file: /run/secrets/db-static.properties
  vault:
    address: http://172.29.0.10:8200
    bootstrap-token-file: /vault/bootstrap/root.token
  gitea:
    internal-url: http://172.29.0.50:3000
    public-url: http://localhost:13000
    owner: pilot-admin
    repo: pilot-config
  config-server:
    url: http://172.29.0.60:8888

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.zaxxer.hikari: WARN
    com.pilot.vault: INFO
